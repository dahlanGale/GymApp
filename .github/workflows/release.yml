name: Release

# Publica una versión nueva en GitHub Releases al subir una etiqueta vX.Y.Z que coincida con
# la versión de package.json. La app instalada revisa esos releases para actualizarse:
# en Windows se descarga e instala sola; en macOS avisa con un enlace de descarga.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la etiqueta coincida con package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de package.json ($VERSION)"
            exit 1
          fi

      # Se crea como borrador para que la app no vea el release hasta que tenga todos los instaladores
      - name: Crear borrador del release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "GymPOS $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # electron-builder sube los instaladores y los latest*.yml que lee el actualizador al borrador
      - name: Generar y subir instaladores
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin certificado de Apple: firma ad-hoc (identity "-") en lugar de buscar uno en el llavero
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publicar el release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
