<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cuerpo del ícono: cuadrado redondeado con el margen de la cuadrícula de macOS (824 de 1024) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  </g>

  <!-- Mancuerna -->
  <g transform="rotate(-35 512 512)" filter="url(#shadow)" fill="#ffffff">
    <rect x="300" y="490" width="424" height="44" rx="22"/>
    <rect x="252" y="352" width="76" height="320" rx="30"/>
    <rect x="696" y="352" width="76" height="320" rx="30"/>
    <rect x="196" y="410" width="62" height="204" rx="26"/>
    <rect x="766" y="410" width="62" height="204" rx="26"/>
    <rect x="164" y="476" width="40" height="72" rx="16"/>
    <rect x="820" y="476" width="40" height="72" rx="16"/>
  </g>
</svg>
